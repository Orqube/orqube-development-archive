name: orqube_safe_hiking
description: ORQUBE standalone safe hiking app
publish_to: none
version: 2.4.2+22
environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"
dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  firebase_app_check: ^0.3.2+10
  cloud_firestore: ^5.6.11
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  http: ^1.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: 7.4.2
  app_links: 6.4.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6
flutter:
  fonts:
    - family: OrqubeHangul
      fonts:
        - asset: assets/fonts/OrqubeHangul.ttf
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
